[package]
name = "questmind"
version = "0.1.0"
description = "QuestMind — AI 陪伴式学习平台"
authors = ["QuestMind"]
edition = "2021"

[lib]
name = "questmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "questmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
